# Verify: analyze + test + release assemble (no upload, no release)
#
# Catches what debug/test can't: Kotlin compile errors, R8 linkage issues
# (lesson 2026-10-18: SharedPreferences NoSuchMethodError was release-only),
# and manifest/Glance breakage from plugin upgrades.
name: Verify

on:
  push:
    branches: [develop, master]
    paths-ignore:
      - '**.md'
      - 'openspec/**'
      - 'informations/**'
      - 'designs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'openspec/**'
      - 'informations/**'
      - 'designs/**'

jobs:
  verify:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Detect NDK
        run: |
          NDK_DIR=$(ls -1d "$ANDROID_HOME/ndk"/*/ 2>/dev/null | sort -V | tail -1)
          if [ -n "$NDK_DIR" ]; then
            echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
            echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          fi

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,x86_64-linux-android

      - name: Install cargo-ndk
        run: command -v cargo-ndk >/dev/null || cargo install cargo-ndk --locked

      - name: Get Dependencies
        run: flutter pub get

      - name: Generate Localizations
        run: flutter gen-l10n || echo "gen-l10n not configured, skipping"

      - name: Run Build Runner
        run: flutter pub run build_runner build

      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Release assemble WITHOUT signing secrets: build.gradle falls back to
      # debug signing when keys are missing, which still compiles all Kotlin,
      # runs R8, and catches linkage breakage. No APK is uploaded.
      # - name: Assemble Release (unsigned fallback)
      #   run: flutter build apk --release --flavor prod --dart-define=cronetHttpNoPlay=true
