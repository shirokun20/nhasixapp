plugins {
    id "com.android.library"
}

// ── Rust FFI: cargo-ndk build (optional, graceful fallback) ──
def rustProjectDir = file("${projectDir}/../rust")
def jniLibsDir = file("${projectDir}/src/main/jniLibs")

task buildRustLibs {
    description = "Build Rust native libraries for Android via cargo-ndk"
    group = "rust"

    // Only attempt Rust build if cargo is available
    doLast {
        def cargoPath = "cargo"
        if (System.getProperty('os.name').toLowerCase().contains('windows')) {
            cargoPath = "cargo.exe"
        }

        try {
            def result = exec {
                workingDir rustProjectDir
                commandLine cargoPath, 'ndk',
                    '-o', jniLibsDir,
                    '-t', 'arm64-v8a',
                    '-t', 'armeabi-v7a',
                    '-t', 'x86_64',
                    'build', '--release'
                environment 'ANDROID_NDK_HOME', System.getenv('ANDROID_NDK_HOME') ?: "${android.ndkDirectory}"
                ignoreExitValue = true
            }
            if (result.exitValue != 0) {
                logger.warn("Rust build skipped or failed. Dart fallback will be used at runtime.")
            }
        } catch (Exception e) {
            logger.warn("cargo-ndk not available. Rust native libraries will not be built. Dart fallback will be used at runtime.")
        }
    }
}

// Hook Rust build into the Android build pipeline
tasks.whenTaskAdded { task ->
    if (task.name == 'preReleaseBuild' || task.name == 'preDebugBuild') {
        task.dependsOn buildRustLibs
    }
}

group = "id.nhasix.kuron_native.kuron_native"
version = "1.0-SNAPSHOT"

android {
    namespace = "id.nhasix.kuron_native.kuron_native"

    compileSdk = 36

    compileOptions {
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    sourceSets {
        main.java.srcDirs += "src/main/kotlin"
        test.java.srcDirs += "src/test/kotlin"
    }

    defaultConfig {
        minSdk = 24
        consumerProguardFiles "proguard-rules.pro"
    }

    dependencies {
        testImplementation("org.jetbrains.kotlin:kotlin-test")
        testImplementation("org.mockito:mockito-core:5.0.0")

        // Native feature dependencies
        implementation 'androidx.browser:browser:1.8.0'
        implementation 'androidx.appcompat:appcompat:1.6.1'
        implementation 'androidx.core:core-ktx:1.12.0'
        implementation 'com.google.android.material:material:1.11.0'
        implementation 'androidx.recyclerview:recyclerview:1.3.2'
        implementation 'org.jetbrains.kotlinx:kotlinx-coroutines-android:1.7.3'
        implementation 'com.antonkarpenko:ffmpeg-kit-full-gpl:2.2.1'

        // Download dependencies
        implementation 'androidx.work:work-runtime-ktx:2.9.0'
        implementation 'com.squareup.okhttp3:okhttp:4.12.0'
        implementation 'com.squareup.okhttp3:okhttp-dnsoverhttps:4.12.0'
        implementation 'org.json:json:20231013'
        // ONNX Runtime for on-device bubble detection
        implementation 'com.microsoft.onnxruntime:onnxruntime-android:1.23.0'
    }

    testOptions {
        unitTests.all {
            useJUnitPlatform()

            testLogging {
               events "passed", "skipped", "failed", "standardOut", "standardError"
               outputs.upToDateWhen {false}
               showStandardStreams = true
            }
        }
    }
}
